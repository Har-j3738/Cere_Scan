name: Bug report
description: Report a reproducible problem in CereScan
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands and inputs where possible.
      placeholder: |
        1. Run ...
        2. Upload ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Ubuntu 24.04 / Python 3.12 / GPU or CPU
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
